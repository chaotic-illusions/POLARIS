[package]
name = "polaris"
version = "1.0.0"
description = "POLARIS (Programmable Operations Layout Author Rendering Interface System): lay out LCARS pages and sites"
authors = ["chaotic-illusions"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
