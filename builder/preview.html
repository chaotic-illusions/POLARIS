<!doctype html>
<!--
  POLARIS Preview: the page in a frame, with play, pause, stop and a scrubber
  under it, and under those the opening's tracks: its parts (frame, content,
  steps) and its sounds, on one time scale. Never published. The page gets builder/preview-clock.js, which puts
  it on the clock these controls drive; the page to show is in the address's
  #fragment (a blob: URL in a browser, ../name.html in the app).
  Dragging a part on the tracks sets its delay, its end its length, and a
  layered sound's start; double-clicking a part puts it back to auto. The page
  is built again with the new timing at once (no reload), and the builder that
  opened the preview saves it to the project, with undo: through its opener
  (lcarsBuilder.previewTiming) in a browser, the preview_timing command in the app.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PREVIEW</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&display=swap">
  <link rel="stylesheet" href="../lcars/palette.css">
  <style>
    :root { color-scheme: dark; --bar: #000; --ink: #000; --dim: #777; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; font-family: "Helvetica Ultra Compressed", "Antonio", "Arial Narrow", sans-serif; text-transform: uppercase; color: var(--lcars-tanoi, #FFCC99); }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
    .transport { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--bar); border-top: 2px solid var(--lcars-atomic-tangerine, #FF9900); flex-wrap: wrap; }
    button { font: inherit; font-size: 17px; letter-spacing: 0.04em; text-transform: uppercase; border: 0; border-radius: 999px; padding: 0.3em 1em; min-height: 30px; color: var(--ink); background: var(--lcars-melrose, #9999FF); cursor: pointer; }
    button:hover { filter: brightness(1.15); }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    button.go { background: var(--lcars-atomic-tangerine, #FF9900); min-width: 6.2em; }
    button.stop { background: var(--lcars-chestnut-rose, #CC6666); }
    button.small { background: var(--lcars-lilac, #CC99CC); padding: 0.3em 0.75em; }
    button[aria-pressed="true"] { background: var(--lcars-golden-tanoi, #FFCC66); }
    button[aria-pressed="false"].toggle { background: #333; color: var(--lcars-tanoi, #FFCC99); }
    .speed button[aria-pressed="false"] { background: #333; color: var(--lcars-tanoi, #FFCC99); }
    .group { display: flex; gap: 4px; }
    .scrub { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; min-width: 200px; }
    input[type="range"] { flex: 1; accent-color: var(--lcars-atomic-tangerine, #FF9900); }
    .time { font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 12.5em; text-align: right; color: var(--lcars-golden-tanoi, #FFCC66); }
    .time small { color: var(--dim); font-size: 15px; }
    .busy .time::after { content: " · LOADING"; color: var(--dim); }

    /* Tracks: a name column, then lanes on the opening's time scale. */
    .tracks { --name: 180px; display: grid; grid-template-columns: var(--name) minmax(0, 1fr); max-height: 38vh; overflow-y: auto; border-top: 1px solid #333; padding: 6px 12px 10px; background: #000; }
    .tracks[hidden] { display: none; }
    .tracks .head { position: sticky; top: 0; z-index: 3; background: #000; padding-bottom: 4px; }
    .views { display: flex; gap: 3px; align-items: center; }
    .views button { font-size: 13px; padding: 0.15em 0.7em; min-height: 22px; }
    .views button[aria-pressed="false"] { background: #333; color: var(--lcars-tanoi, #FFCC99); }
    .ruler { position: relative; height: 24px; cursor: col-resize; touch-action: none; }
    .ruler .tick { position: absolute; bottom: 0; height: 6px; border-left: 1px solid #555; }
    .ruler .tick span { position: absolute; bottom: 7px; left: 3px; font-size: 13px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ruler .tick.major { height: 10px; border-color: #888; }
    .name { font-size: 15px; letter-spacing: 0.03em; padding: 0 10px 0 0; height: 26px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--lcars-tanoi, #FFCC99); }
    .lane { position: relative; height: 26px; border-bottom: 1px solid #1c1c1c; cursor: col-resize; touch-action: none; }
    .name.tall, .lane.tall { height: 36px; } /* sounds: room for their shape */
    .block { position: absolute; top: 3px; bottom: 3px; border-radius: 10px; min-width: 3px; overflow: hidden; color: #000; font-size: 13px; letter-spacing: 0.04em; display: flex; align-items: center; padding: 0 8px; box-sizing: border-box; white-space: nowrap; }
    .block.frame { background: var(--lcars-atomic-tangerine, #FF9900); }
    .block.content { background: var(--lcars-orange-peel, #FF9966); }
    .block.step { background: var(--lcars-lilac, #CC99CC); }
    .block.sound { background: #1d1d3a; border: 1px solid var(--lcars-melrose, #9999FF); padding: 0; }
    .block.sound svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .block.sound path { fill: var(--lcars-anakiwa, #99CCFF); }
    .block span { position: relative; overflow: hidden; text-overflow: ellipsis; }
    .group-label { grid-column: 1 / -1; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; margin: 6px 0 2px; }
    .names { grid-column: 1; }
    .lanes-wrap { grid-column: 2; position: relative; }
    .playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 2; box-shadow: 0 0 6px rgb(255 255 255 / 0.6); }
    .empty { grid-column: 1 / -1; color: var(--dim); font-size: 15px; padding: 6px 0; }
    /* Parts and layered sounds that can be dragged: the body to move, the end to change the length. */
    .block.movable { cursor: grab; }
    .block.dragging { cursor: grabbing; z-index: 1; filter: brightness(1.2); }
    .block.own { box-shadow: inset 0 0 0 2px #fff; }
    .grip { position: absolute; top: 0; bottom: 0; right: 0; width: 9px; cursor: ew-resize; background: rgb(0 0 0 / 0.25); border-left: 1px solid rgb(0 0 0 / 0.5); }
    .readout { position: absolute; top: -2px; z-index: 4; transform: translateY(-100%); padding: 1px 6px; border-radius: 6px; background: #fff; color: #000; font-size: 13px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
    .saved { grid-column: 1 / -1; font-size: 13px; color: var(--dim); letter-spacing: 0.04em; padding: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved.bad { color: var(--lcars-chestnut-rose, #CC6666); }
  </style>
</head>
<body>
  <iframe id="page" title="PAGE PREVIEW"></iframe>
  <div class="transport" role="toolbar" aria-label="PLAYBACK">
    <div class="group">
      <button type="button" class="small" id="restart" title="PLAY FROM THE START (HOME)">⏮ RESTART</button>
      <button type="button" class="go" id="play" title="PLAY OR PAUSE (SPACE)">❚❚ PAUSE</button>
      <button type="button" class="stop" id="stop" title="BACK TO THE START, PAUSED">■ STOP</button>
    </div>
    <div class="group">
      <button type="button" class="small" id="back" title="ONE FRAME BACK (←; SHIFT: 250 MS)">◀ FRAME</button>
      <button type="button" class="small" id="fwd" title="ONE FRAME ON (→; SHIFT: 250 MS)">FRAME ▶</button>
    </div>
    <div class="scrub">
      <input type="range" id="scrub" min="0" max="5000" step="1" value="0" aria-label="POSITION IN THE OPENING, IN MILLISECONDS">
      <span class="time" id="time">0 MS <small>/ 0 MS</small></span>
    </div>
    <div class="group speed" role="group" aria-label="SPEED">
      <button type="button" data-rate="0.25" aria-pressed="false" title="QUARTER SPEED (SILENT)">¼×</button>
      <button type="button" data-rate="0.5" aria-pressed="false" title="HALF SPEED (SILENT)">½×</button>
      <button type="button" data-rate="1" aria-pressed="true" title="FULL SPEED, WITH SOUND">1×</button>
    </div>
    <div class="group">
      <button type="button" class="toggle" id="loop" aria-pressed="false" title="PLAY THE OPENING OVER AND OVER (L)">⟳ LOOP</button>
      <button type="button" class="small" id="shuffle" title="ANOTHER TAKE OF THE RANDOM PARTS (KEY PRESSES, GAUGES ...)">SHUFFLE</button>
      <button type="button" class="toggle" id="show-tracks" aria-pressed="true" aria-controls="tracks" title="SHOW OR HIDE THE TRACKS (T)">TRACKS</button>
    </div>
  </div>
  <div class="tracks" id="tracks" aria-label="TRACKS">
    <div class="saved" id="saved" role="status">DRAG A PART TO MOVE IT (ITS DELAY) · ITS END FOR ITS LENGTH · DOUBLE-CLICK IT FOR AUTO · A LAYERED SOUND TO MOVE IT</div>
    <div class="head views" role="group" aria-label="WHICH TRACKS">
      <button type="button" data-view="video" aria-pressed="false" title="THE OPENING&#39;S PARTS">VIDEO</button>
      <button type="button" data-view="audio" aria-pressed="false" title="THE OPENING&#39;S SOUNDS">AUDIO</button>
      <button type="button" data-view="both" aria-pressed="true" title="PARTS AND SOUNDS">BOTH</button>
    </div>
    <div class="head ruler" id="ruler" aria-hidden="true"></div>
    <div id="track-rows" style="display: contents"></div>
  </div>
  <script>
    "use strict";
    const $ = (s) => document.querySelector(s);
    const frame = $("#page"), scrub = $("#scrub"), time = $("#time"), playBtn = $("#play"), loopBtn = $("#loop");
    const FRAME_MS = 1000 / 30; // one frame of 30 a second
    const TAIL = 500; // the scrubber runs a little past the opening's end, to see it settle

    const state = {
      seed: (Math.random() * 2 ** 32) >>> 0,
      request: null, // what the next load of the page should do (after a Shuffle): { t, play, rate }
      clock: null,
      rate: 1,
      loop: false,
      dragging: false,
      wasPlaying: false,
    };

    // The page's clock finds the preview here (builder/preview-clock.js).
    window.PolarisPreview = {
      get seed() { return state.seed; },
      takeRequest() { const r = state.request; state.request = null; return r; },
      attach(clock) { state.clock = clock; },
      key: (key, shift) => onKey(key, shift),
    };

    // The page: the #fragment, relative to this file (or a blob: URL).
    const target = decodeURIComponent(location.hash.slice(1));
    if (target) frame.src = new URL(target, location.href).href;
    frame.addEventListener("load", () => {
      try {
        const title = frame.contentDocument?.title;
        if (title) document.title = `PREVIEW · ${title}`;
      } catch { /* another origin */ }
    });

    const now = () => state.clock?.state() ?? null;
    const ready = () => { const s = now(); return s && s.t != null ? s : null; };

    /** Go to t (ms from the opening's start), playing or paused. */
    function seek(t, play) {
      const s = ready();
      if (!s) return;
      state.clock.seek(Math.max(0, t));
      play ? state.clock.play() : state.clock.pause();
    }
    function togglePlay() {
      const s = ready();
      if (!s) return;
      s.playing ? state.clock.pause() : state.clock.play();
    }
    function stepBy(ms) {
      if (ready()) state.clock.step(ms);
    }
    function setRate(r) {
      state.rate = r;
      state.clock?.setRate(r);
      paintSpeed();
    }
    function onKey(key, shift) {
      const by = shift ? 250 : FRAME_MS;
      if (key === " ") togglePlay();
      else if (key === "Home") seek(0, true);
      else if (key === "ArrowLeft") stepBy(-by);
      else if (key === "ArrowRight") stepBy(by);
      else if (key === "l" || key === "L") setLoop(!state.loop);
      else if (key === "t" || key === "T") toggleTracks();
    }
    addEventListener("keydown", (e) => {
      if (e.target.closest?.("input, select, textarea")) return;
      if (!/^( |Home|ArrowLeft|ArrowRight|l|L|t|T)$/.test(e.key) || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === " " && e.target.closest?.("button")) return; // a focused button takes its own Space
      e.preventDefault();
      onKey(e.key, e.shiftKey);
    });

    $("#restart").addEventListener("click", () => seek(0, true));
    playBtn.addEventListener("click", togglePlay);
    $("#stop").addEventListener("click", () => seek(0, false));
    $("#back").addEventListener("click", (e) => stepBy(e.shiftKey ? -250 : -FRAME_MS));
    $("#fwd").addEventListener("click", (e) => stepBy(e.shiftKey ? 250 : FRAME_MS));
    // Another take of the random parts: the page loads again with a new seed, at the same place.
    $("#shuffle").addEventListener("click", () => {
      const s = now();
      state.seed = (Math.random() * 2 ** 32) >>> 0;
      state.request = { t: s?.t ?? 0, play: s ? s.playing : true, rate: state.rate };
      state.clock = null;
      try { frame.contentWindow.location.reload(); } catch { frame.src = frame.src; }
    });
    function setLoop(on) {
      state.loop = on;
      loopBtn.setAttribute("aria-pressed", String(on));
    }
    loopBtn.addEventListener("click", () => setLoop(!state.loop));
    for (const b of document.querySelectorAll(".speed button")) b.addEventListener("click", () => setRate(Number(b.dataset.rate)));
    function paintSpeed() {
      for (const b of document.querySelectorAll(".speed button")) b.setAttribute("aria-pressed", String(Number(b.dataset.rate) === state.rate));
    }

    // Scrubbing: the page follows as you drag, paused; it plays on from where you let go if it was playing.
    scrub.addEventListener("pointerdown", () => {
      const s = ready();
      state.dragging = true;
      state.wasPlaying = !!s?.playing;
      if (s?.playing) state.clock.pause();
    });
    scrub.addEventListener("input", () => {
      const v = Number(scrub.value);
      paintTime(v);
      if (ready()) state.clock.seek(v);
    });
    scrub.addEventListener("change", () => {
      const v = Number(scrub.value);
      if (ready()) {
        state.clock.seek(v);
        if (state.dragging && state.wasPlaying) state.clock.play();
      }
      state.dragging = false;
    });
    addEventListener("pointerup", () => {
      if (!state.dragging) return;
      state.dragging = false;
      if (state.wasPlaying) state.clock?.play();
    });

    function paintTime(t, s = now()) {
      const end = s?.timeline ? `${Math.max(1000, Math.round(s.end))} MS` : "NO OPENING";
      time.innerHTML = `${Math.round(t)} MS <small>/ ${end}</small>`;
    }

    // Keep the controls in step with the page.
    function tick() {
      const s = ready();
      document.body.classList.toggle("busy", !s);
      if (s) {
        // A page without an opening: as far as it has played (at least 10 s), for its effects.
        const max = s.timeline ? Math.max(1000, Math.round(s.end)) + TAIL : Math.max(10000, Math.round(s.t));
        if (Number(scrub.max) !== max) scrub.max = String(max);
        if (!state.dragging) {
          scrub.value = String(Math.min(max, Math.round(s.t)));
          paintTime(s.t, s);
        }
        playBtn.textContent = s.playing ? "❚❚ PAUSE" : "▶ PLAY";
        if (s.rate !== state.rate) { state.rate = s.rate; paintSpeed(); }
        if (state.loop && s.playing && s.t > Math.max(1000, s.end) + TAIL) state.clock.seek(0);
      }
      paintTracksNow(s);
      requestAnimationFrame(tick);
    }
    /* ---- tracks ---- */

    const tracksEl = $("#tracks"), rowsEl = $("#track-rows"), ruler = $("#ruler");
    const VIEW_KEY = "polaris-preview:tracks";
    const view = { show: true, which: "both" };
    try { Object.assign(view, JSON.parse(localStorage.getItem(VIEW_KEY)) || {}); } catch { /* storage unavailable */ }
    const keepView = () => { try { localStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch { /* storage unavailable */ } };
    let shownTimeline, shownSpan = 0, shownWhich = "", playheads = [];

    function paintView() {
      tracksEl.hidden = !view.show;
      $("#show-tracks").setAttribute("aria-pressed", String(view.show));
      for (const b of document.querySelectorAll(".views button")) b.setAttribute("aria-pressed", String(b.dataset.view === view.which));
      shownWhich = "";
    }
    const toggleTracks = () => { view.show = !view.show; keepView(); paintView(); };
    $("#show-tracks").addEventListener("click", toggleTracks);
    for (const b of document.querySelectorAll(".views button")) {
      b.addEventListener("click", () => { view.which = b.dataset.view; keepView(); paintView(); });
    }

    const el = (tag, cls, text) => {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    };
    const pct = (ms, span) => `${(ms / span) * 100}%`;

    /** The ruler's marks: a labelled one at least every 90 px or so, four small ones between. */
    function paintRuler(span) {
      ruler.replaceChildren();
      const width = ruler.clientWidth || 600;
      const every = [50, 100, 250, 500, 1000, 2000, 5000].find((s) => (s / span) * width >= 90) || 10000;
      const minor = every / 5;
      for (let i = 0; i * minor <= span; i++) {
        const ms = i * minor, major = i % 5 === 0;
        const tick = el("div", `tick${major ? " major" : ""}`);
        tick.style.left = pct(ms, span);
        if (major) tick.append(el("span", "", ms === 0 ? "0 MS" : String(Math.round(ms))));
        ruler.append(tick);
      }
    }

    /** A sound's outline, as a filled shape mirrored about the middle (square-rooted, nearer how loud it sounds). */
    function wave(peaks) {
      const NS = "http://www.w3.org/2000/svg", n = peaks.length;
      peaks = peaks.map(Math.sqrt);
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", `0 0 ${n} 100`);
      svg.setAttribute("preserveAspectRatio", "none");
      const top = peaks.map((v, i) => `${i + 0.5},${50 - Math.max(1, v * 46)}`);
      const bottom = peaks.map((v, i) => `${i + 0.5},${50 + Math.max(1, v * 46)}`).reverse();
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", `M0,50 L${top.join(" L")} L${n},50 L${bottom.join(" L")} Z`);
      svg.append(path);
      return svg;
    }

    /** One section (video or audio): names down the first column, lanes down the second, a playhead over the lanes. */
    function section(label, items, kindOf, span) {
      if (view.which === "both") rowsEl.append(el("div", "group-label", label));
      const names = el("div", "names"), lanes = el("div", "lanes-wrap");
      for (const item of items) {
        const kind = kindOf(item), tall = kind === "sound" ? " tall" : "";
        const name = el("div", `name${tall}`, item.label);
        name.title = item.label;
        names.append(name);
        const lane = el("div", `lane${tall}`);
        const block = el("div", `block ${kind}`);
        block.style.left = pct(item.start, span);
        block.style.width = pct(Math.max(item.length, 1), span);
        block.dataset.id = item.id;
        const how = editable(item);
        block.title = `${item.label}: ${item.start} → ${item.start + item.length} MS (${item.length} MS)` + (how ? ` · ${how.own ? "SET" : "AUTO"}` : "");
        if (kind === "sound" && item.peaks?.length) block.append(wave(item.peaks));
        else block.append(el("span", "", `${item.length} MS`));
        if (how?.move) block.classList.add("movable");
        if (how?.own) block.classList.add("own");
        if (how?.length) block.append(el("i", "grip"));
        lane.append(block);
        lanes.append(lane);
      }
      const ph = el("div", "playhead");
      lanes.append(ph);
      playheads.push(ph);
      rowsEl.append(names, lanes);
    }

    function paintTracks(tl, span) {
      rowsEl.replaceChildren();
      playheads = [];
      paintRuler(span);
      if (!tl) {
        rowsEl.append(el("div", "empty", "THIS PAGE HAS NO OPENING, SO THERE ARE NO TRACKS."));
        return;
      }
      if (view.which !== "audio") section("VIDEO", tl.parts, (p) => (p.id === "frame" ? "frame" : p.id === "content" ? "content" : "step"), span);
      if (view.which !== "video") {
        if (tl.sounds.length) section("AUDIO", tl.sounds, () => "sound", span);
        else rowsEl.append(el("div", "empty", "THE OPENING PLAYS SILENTLY."));
      }
    }

    /*
     * Timing: what can be dragged. A part's key in data-flow-steps ("frame", "content",
     * a step's number) or a layered sound's place in data-flow-layers; whether it has
     * timing of its own (else it's auto); and what dragging it changes.
     */
    function editable(item) {
      const cfg = state.clock?.config?.();
      if (!cfg) return null;
      if (item.id === "frame") return { key: "frame", own: cfg.steps.frame?.length != null, move: false, length: true };
      const step = item.id === "content" ? "content" : item.id.match(/^step-(\d+)$/)?.[1];
      if (step) {
        const c = cfg.steps[step] || {};
        return { key: step, own: c.delay != null || c.length != null || c.at != null, move: true, length: true };
      }
      const layer = item.id.match(/^layer-(\d+)$/);
      if (layer && cfg.layers[layer[1] - 1]) return { layer: layer[1] - 1, own: true, move: true, length: false };
      return null;
    }

    const savedEl = $("#saved");
    function said(text, bad = false) {
      savedEl.textContent = text;
      savedEl.classList.toggle("bad", bad);
    }

    /** Send the page's timing to the builder that opened the preview, to save in the project. */
    function tellBuilder(timing) {
      const invoke = window.__TAURI__?.core?.invoke;
      if (invoke) {
        invoke("preview_timing", { timing }).then(() => said("SAVED TO THE PROJECT · CTRL+Z IN THE BUILDER UNDOES IT"),
          (err) => said(`NOT SAVED: ${String(err).toUpperCase()}`, true));
        return;
      }
      let builder = null;
      try { builder = window.opener?.lcarsBuilder; } catch { /* another origin */ }
      if (!builder?.previewTiming) return said("NOT SAVED: THE BUILDER THAT OPENED THIS PREVIEW IS CLOSED", true);
      builder.previewTiming(timing);
      said("SAVED TO THE PROJECT · CTRL+Z IN THE BUILDER UNDOES IT");
    }

    /**
     * Change one part's (or layered sound's) timing: the page is built again with it, from
     * where it is, and the builder saves it. what: "move" (start, ms), "length" (ms) or "auto".
     */
    function retime(how, what, value, prevStart = 0) {
      const s = ready(), cfg = state.clock?.config?.();
      if (!s || !cfg) return;
      const { steps, layers } = cfg;
      if (how.layer != null) {
        layers[how.layer].at = Math.max(0, Math.round(value - 50)) / 1000; // sounds start 50 ms in
      } else {
        const part = { ...(steps[how.key] || {}) };
        if (what === "move") { part.delay = Math.max(0, Math.round(value - prevStart)); delete part.at; }
        else if (what === "length") part.length = Math.max(1, Math.round(value));
        else { delete part.delay; delete part.length; delete part.at; }
        if (Object.keys(part).length) steps[how.key] = part;
        else delete steps[how.key];
      }
      state.clock.retime({ steps, layers });
      const timing = { page: s.page, steps: {}, layers: layers.map((l) => l.at) };
      if (how.layer == null) {
        const p = steps[how.key] || {};
        timing.steps[how.key] = { delay: p.delay ?? null, length: p.length ?? null, at: p.at ?? null };
      }
      tellBuilder(timing);
    }

    // Dragging a part: its body moves it (its delay), its end changes its length. Edges snap to
    // other parts' and the playhead (within 6 px; Alt: not), times to 10 ms (Shift: 1 ms).
    let edit = null;
    function beginEdit(e, block) {
      const s = ready(), tl = shownTimeline;
      if (!s || !tl) return false;
      const id = block.dataset.id;
      const list = id.startsWith("layer-") ? tl.sounds : tl.parts;
      const idx = list.findIndex((p) => p.id === id);
      const item = list[idx], how = item && editable(item);
      const mode = e.target.closest(".grip") ? "length" : "move";
      if (!how || (mode === "move" && !how.move) || (mode === "length" && !how.length)) return false;
      const lane = block.parentElement;
      // A step starts no earlier than the part before it (the content, no earlier than the frame).
      const prevStart = how.layer != null ? 0 : idx > 0 ? tl.parts[idx - 1].start : 0;
      const edges = [...tl.parts, ...tl.sounds].filter((p) => p !== item).flatMap((p) => [p.start, p.start + p.length]);
      edit = { block, lane, item, how, mode, prevStart, edges, x0: e.clientX, width: lane.getBoundingClientRect().width,
        span: shownSpan, value: mode === "move" ? item.start : item.length, moved: false, readout: null };
      lane.setPointerCapture(e.pointerId);
      return true;
    }
    function moveEdit(e) {
      const d = edit, dx = e.clientX - d.x0;
      if (!d.moved && Math.abs(dx) < 3) return;
      if (!d.moved) {
        d.moved = true;
        d.block.classList.add("dragging");
        d.readout = el("div", "readout");
        d.lane.append(d.readout);
      }
      const perPx = d.span / d.width;
      const grid = e.shiftKey ? 1 : 10;
      const base = (d.mode === "move" ? d.item.start : d.item.length) + dx * perPx;
      let v = Math.round(base / grid) * grid;
      if (!e.altKey) {
        const t = ready()?.t;
        const marks = t != null ? [...d.edges, t] : d.edges;
        // The edge being moved: the start (and, moving, the end too) against the others.
        const ends = d.mode === "move" ? [[base, 0], [base + d.item.length, d.item.length]] : [[d.item.start + base, d.item.start]];
        let best = 6 * perPx;
        for (const [edge, off] of ends) for (const m of marks) {
          if (Math.abs(m - edge) < best) { best = Math.abs(m - edge); v = Math.round(m - off); }
        }
      }
      if (d.mode === "move") v = Math.max(d.how.layer != null ? 50 : d.prevStart, v);
      else v = Math.max(10, v);
      d.value = v;
      const start = d.mode === "move" ? v : d.item.start, length = d.mode === "move" ? d.item.length : v;
      d.block.style.left = pct(start, d.span);
      d.block.style.width = pct(Math.max(length, 1), d.span);
      d.readout.style.left = pct(start, d.span);
      d.readout.textContent = d.mode === "length" ? `LENGTH ${v} MS`
        : d.how.layer != null ? `STARTS AT ${v - 50} MS`
          : d.item.id === "content" ? `DELAY ${v - d.prevStart} MS AFTER THE FRAME STARTS`
            : `DELAY ${v - d.prevStart} MS · STARTS AT ${v} MS`;
    }
    function endEdit(e, cancel = false) {
      const d = edit;
      edit = null;
      d.readout?.remove();
      d.block.classList.remove("dragging");
      if (!d.moved) { // a click: go there, as a click on a lane does
        if (!cancel && ready()) state.clock.seek(timeAt(e, d.lane));
        return;
      }
      if (cancel) {
        d.block.style.left = pct(d.item.start, d.span);
        d.block.style.width = pct(Math.max(d.item.length, 1), d.span);
        return;
      }
      if (d.value !== (d.mode === "move" ? d.item.start : d.item.length)) retime(d.how, d.mode, d.value, d.prevStart);
    }
    addEventListener("keydown", (e) => {
      if (e.key === "Escape" && edit) { e.preventDefault(); endEdit(e, true); }
    }, true);
    tracksEl.addEventListener("dblclick", (e) => {
      // The lane holds the pointer while a block is pressed, so the double-click lands on it: find the block under it.
      const block = document.elementFromPoint(e.clientX, e.clientY)?.closest(".block");
      const item = block && shownTimeline?.parts.find((p) => p.id === block.dataset.id);
      const how = item && editable(item);
      if (!how || !how.own || how.layer != null) return;
      retime(how, "auto");
    });

    // Clicking or dragging on the ruler or a lane moves the opening there, as the scrubber does.
    let dragOn = null;
    const timeAt = (e, target) => {
      const r = target.getBoundingClientRect();
      return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * shownSpan;
    };
    tracksEl.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      const block = e.target.closest(".block");
      if (block && beginEdit(e, block)) { e.preventDefault(); return; }
      const target = e.target.closest(".ruler, .lane");
      const s = ready();
      if (!target || !s || !shownSpan) return;
      e.preventDefault();
      dragOn = target;
      target.setPointerCapture(e.pointerId);
      state.wasPlaying = s.playing;
      if (s.playing) state.clock.pause();
      state.clock.seek(timeAt(e, target));
    });
    tracksEl.addEventListener("pointermove", (e) => {
      if (edit) return moveEdit(e);
      if (dragOn && ready()) state.clock.seek(timeAt(e, dragOn));
    });
    const endDrag = (e) => {
      if (edit) return endEdit(e, e.type === "pointercancel");
      if (!dragOn) return;
      dragOn = null;
      if (state.wasPlaying) state.clock?.play();
    };
    tracksEl.addEventListener("pointerup", endDrag);
    tracksEl.addEventListener("pointercancel", endDrag);
    addEventListener("resize", () => { shownWhich = ""; });

    /** Keep the tracks in step with the page: rebuilt when its timeline changes, the playhead every frame. */
    function paintTracksNow(s) {
      if (!view.show || !s) return;
      const tl = s.timeline ?? null;
      const span = tl ? Math.max(1000, Math.round(tl.end)) + TAIL : 0;
      if (!edit && (tl !== shownTimeline || span !== shownSpan || view.which !== shownWhich)) {
        shownTimeline = tl;
        shownSpan = span;
        shownWhich = view.which;
        paintTracks(tl, span || 1000);
      }
      if (s.t != null && shownSpan) for (const ph of playheads) ph.style.left = pct(Math.min(s.t, shownSpan), shownSpan);
    }

    paintView();
    paintSpeed();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
